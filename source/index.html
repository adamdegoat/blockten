<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090b">
<title>Block Ten</title>
<style>
  html,body{margin:0;height:100%;background:#07090b;overflow:hidden;
    font-family:ui-monospace,Menlo,monospace;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #err{position:fixed;top:0;left:0;z-index:99;color:#f66;font-size:11px;white-space:pre-wrap}

  #stick{display:none;position:fixed;z-index:20;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:50%;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.035);
    pointer-events:none}
  #stick-dot{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;background:rgba(255,255,255,.16)}

  #hint{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:18;font-size:11px;letter-spacing:.1em;color:rgba(215,225,235,.5);pointer-events:none;
    text-shadow:0 1px 6px #000}

  #floor{position:fixed;left:calc(18px + env(safe-area-inset-left));top:calc(16px + env(safe-area-inset-top));
    z-index:18;font-size:11px;letter-spacing:.22em;color:rgba(205,215,228,.55);pointer-events:none;
    text-shadow:0 1px 6px #000}
  #prompt{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);z-index:18;font-size:12px;
    letter-spacing:.16em;color:rgba(240,228,200,0);pointer-events:none;transition:color .35s;
    text-shadow:0 1px 8px #000}
  #prompt.on{color:rgba(240,228,200,.92)}
  #end{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:#050608;padding:8vw;opacity:0;transition:opacity 1.4s}
  #end.show{display:flex;opacity:1}
  #end h1{margin:0 0 .4em;font-size:clamp(24px,6vw,42px);letter-spacing:.1em;color:#e8e1d3;font-weight:400}
  #end p{margin:0 0 2.2em;font-size:12px;letter-spacing:.08em;color:#5f6873}
  #end button{font-family:inherit;font-size:11px;letter-spacing:.2em;color:#0a0c0f;background:#cfc6b2;
    border:0;padding:1em 2.6em}
  #gate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:#07090b;padding:8vw;transition:opacity .6s}
  #gate.hide{opacity:0;pointer-events:none}
  #gate h1{margin:0 0 .2em;font-size:clamp(26px,7vw,46px);letter-spacing:.16em;color:#e6e0d4;font-weight:400}
  #gate p{margin:0 0 2em;font-size:12px;line-height:2;color:#68727d;letter-spacing:.05em;max-width:34ch}
  #gate .go{font-size:11px;letter-spacing:.2em;color:#0a0c0f;background:#cfc6b2;padding:1em 2.6em}
  .kb{display:none}@media(pointer:fine){.kb{display:inline}.tc{display:none}}
</style></head><body>
<div id="err"></div>
<div id="stick"><div id="stick-dot"></div></div>
<div id="floor"></div>
<div id="prompt"></div>
<div id="end"></div>
<div id="hint"><span class="tc">left thumb walk · drag to look · tap to interact</span><span class="kb">WASD · mouse · E</span></div>
<div id="gate">
  <h1>BLOCK TEN</h1>
  <p>Sixth floor. Your flat is at the top.<br>Nobody here is going to help you.</p>
  <div class="go ui" id="go">ENTER</div>
</div>
<script>window.addEventListener('error',e=>{document.getElementById('err').textContent+=e.message+'\n@'+e.lineno+'\n';
  fetch('/log',{method:'POST',body:'ERR '+e.message+' @'+e.lineno}).catch(()=>{});});</script>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module" src="/src/main.js"></script>
<script type="module">
  const g=document.getElementById('gate');
  const go=async()=>{g.classList.add('hide');
    try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}};
  document.getElementById('go').addEventListener('click',go);
  document.getElementById('go').addEventListener('touchend',e=>{e.preventDefault();go()},{passive:false});
</script>
</body></html>
